# Ruff settings for this repository.
#
# Run with:  python -m ruff check .
# Ruff is not a runtime dependency and is deliberately not in requirements.txt. It is installed
# once, by hand, into the Windows interpreter:  pip install ruff
#
# This is a `ruff.toml` and not a `[tool.ruff]` section in a `pyproject.toml` on purpose:
# the repository is deliberately not a Python package (see AGENTS.md, "Loading model"),
# and a pyproject.toml would suggest otherwise.
#
# The ignored rules below are not oversights. This is a teaching repository of demo code,
# and each entry records a decision that is documented in AGENTS.md.

line-length = 120

target-version = "py314"

exclude = ["data", "docker"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "BLE",  # flake8-blind-except
    "TRY",  # tryceratops
]

ignore = [
    # The notebooks, the setup scripts and verify/ print their progress. That is the demo — the
    # audience watches the output scroll by, and it is the counterpart of the sibling's
    # `-Level Host`. lib/ is a different matter: nothing in there prints any more, it logs, and
    # that is enforced by review rather than here, because this rule cannot tell the two apart.
    "T201",

    # `except Exception` is the deliberate shape of the enable_exception contract: catch
    # everything, then either re-raise or print and return None. Narrowing it per provider
    # would mean knowing every driver's exception hierarchy, which is not what the demo shows.
    "BLE001",
    "TRY002",
    "TRY003",
    "TRY300",
    "TRY400",

    # The same contract, seen from its two other sides. The guard clauses ("no data", "unknown
    # as_type") raise inside the `try` on purpose, so that a caller's own mistake comes back
    # through exactly the same path as a driver error — one message shape, one enable_exception.
    # Abstracting them into an inner function, as TRY301 asks, would hide that. And the re-raise
    # is `raise Exception(message)` without `from e` because the message already carries `str(e)`;
    # chaining would print the cause twice on a slide.
    "TRY301",
    "B904",

    # ElementTree reads the StackExchange XML dump in demo/02 and in all three
    # import_*_table functions, and the GPX files in demo/03. Both are artifacts that
    # 05_sample_data_setup.py downloaded from a known URL, not untrusted input, and swapping in
    # defusedxml would add a dependency and a name the audience has to be told about mid-scenario.
    "S314",

    # SQL is built from table and column names that come out of the schema of the very table
    # being written to, and identifiers are quoted before interpolation. There is no user input
    # in the string. Values always go through `?` placeholders — that part is not negotiable.
    "S608",

    # The demo password is public on purpose. Every container is local and throwaway, and
    # showing the credential handling in plain sight is part of the demo.
    "S105",
    "S106",
    "S107",

    # 05_sample_data_setup.py calls 7za to unpack the downloaded archive, exactly as the
    # sibling repository does. The argument list is fixed, nothing goes through a shell, and
    # the script only ever runs inside the WSL2 that installed the binary in the first place.
    "S603",
    "S607",

    # import_gpx_file builds the WKT for a track and for a route in two loops that are written
    # to look alike, because that similarity is the point being made on the slide. The track has
    # three cases and cannot become a ternary; the route has two and could. Taking the suggestion
    # would rewrite one half of a matched pair and leave the other, which is exactly the
    # unexplained divergence between siblings that AGENTS.md calls a bug.
    "SIM108",
]

# Import sorting (I), the docstring rules (D) and `ruff format` are deliberately left off.
# Turning them on would reformat files nobody is otherwise touching, and the resulting diff
# would bury the findings that matter. Indentation and line endings are covered by
# .editorconfig instead.

[lint.per-file-ignores]
# Notebooks are stepped through cell by cell. Imports repeated in a later cell, variables that
# are only ever looked at interactively, and a bare expression on the last line of a cell are
# pedagogical, not dead code.
#
# E501 is here rather than in the global ignore: the long lines are all SQL passed to
# invoke_*_query, and wrapping a statement to fit 120 columns makes it harder to read out loud,
# not easier. It stays enforced for lib/ and the setup scripts, where nothing needs the room.
"demo/*.ipynb" = ["E402", "F401", "F811", "B018", "E501"]
